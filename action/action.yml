name: "ArcBridge Drift Check"
description: >-
  Fail CI when code drifts from the committed ArcBridge architecture model
  (.arcbridge/). Runs `arcbridge drift --reindex`, writes a job summary, and
  posts a sticky PR comment with the findings.
author: bifteki-crew
branding:
  icon: "layers"
  color: "purple"

inputs:
  working-directory:
    description: "Directory containing the .arcbridge/ model (monorepo support)."
    required: false
    default: "."
  severity-threshold:
    description: "Fail the check when drift at or above this severity exists: error, warning, or info."
    required: false
    default: "error"
  comment:
    description: "Post/update a sticky PR comment with the findings (needs pull-requests: write)."
    required: false
    default: "true"
  base:
    description: >-
      Only report drift on files changed since this git ref — a PR-incremental
      check. Accepts a branch, tag, or SHA, or the arcbridge keywords
      last-commit/last-sync/last-phase (note: in a fresh CI checkout the
      keywords fall back to recent-commit heuristics, so prefer an explicit
      ref). Empty (default) checks the whole model. For PRs, pass the base SHA
      (github.event.pull_request.base.sha); see the README.
    required: false
    default: ""
  arcbridge-version:
    description: "arcbridge npm version to run."
    required: false
    default: "0.13.0"
  node-version:
    description: "Node.js version to set up. arcbridge needs >= 22.16; the default pins the tested minimum for deterministic behavior."
    required: false
    default: "22.16.0"

outputs:
  error-count:
    description: "Number of error-severity drift entries."
    value: ${{ steps.summarize.outputs.error-count }}
  warning-count:
    description: "Number of warning-severity drift entries."
    value: ${{ steps.summarize.outputs.warning-count }}
  info-count:
    description: "Number of info-severity drift entries."
    value: ${{ steps.summarize.outputs.info-count }}
  total-count:
    description: "Total number of drift entries."
    value: ${{ steps.summarize.outputs.total-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run arcbridge drift
      id: drift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Passed via env (not interpolated into the script) so shell
        # metacharacters in the input can't alter the command being run
        ARCBRIDGE_VERSION: ${{ inputs.arcbridge-version }}
        ARCBRIDGE_BASE: ${{ inputs.base }}
      run: |
        # Exact version or dist-tag only (no ranges — their chars overlap shell syntax)
        if ! [[ "$ARCBRIDGE_VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
          echo "::error::Invalid arcbridge-version \"${ARCBRIDGE_VERSION//[^0-9A-Za-z.+-]/_}\" — use an exact npm version (e.g. 0.13.0) or dist-tag (e.g. latest)."
          exit 1
        fi
        ARGS=(drift --reindex --json)
        if [ -n "$ARCBRIDGE_BASE" ]; then
          # A git ref/SHA — allow only ref-safe characters (branch names may
          # contain '/'), reject anything that could alter the command.
          if ! [[ "$ARCBRIDGE_BASE" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "::error::Invalid base ref \"${ARCBRIDGE_BASE//[^0-9A-Za-z._/-]/_}\" — pass a branch, tag, or SHA."
            exit 1
          fi
          # `--base` ships in arcbridge 0.11.0; older CLIs silently ignore the
          # flag, which would masquerade as a full-model check. Hard-fail early
          # for exact x.y.z versions below 0.11.0, compared with pure bash
          # arithmetic (no GNU sort -V dependency). Anything else — dist-tags
          # (latest) and prereleases (0.11.0-beta) — can't be reliably compared
          # and passes through.
          if [[ "$ARCBRIDGE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJ=$((10#${BASH_REMATCH[1]})) MIN=$((10#${BASH_REMATCH[2]})) PAT=$((10#${BASH_REMATCH[3]}))
            REQ_MAJ=0 REQ_MIN=11 REQ_PAT=0  # --base minimum: 0.11.0
            if (( MAJ < REQ_MAJ || (MAJ == REQ_MAJ && (MIN < REQ_MIN || (MIN == REQ_MIN && PAT < REQ_PAT))) )); then
              echo "::error::The base input requires arcbridge >= $REQ_MAJ.$REQ_MIN.$REQ_PAT (got $ARCBRIDGE_VERSION) — older CLIs silently ignore --base. Bump arcbridge-version or drop base."
              exit 1
            fi
          fi
          ARGS+=(--base "$ARCBRIDGE_BASE")
        fi
        set +e
        npx -y "arcbridge@$ARCBRIDGE_VERSION" "${ARGS[@]}" \
          > "$RUNNER_TEMP/arcbridge-drift.json" 2> "$RUNNER_TEMP/arcbridge-drift.log"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        set -e
        # Reindex notes / warnings go to stderr — surface them in the job log
        cat "$RUNNER_TEMP/arcbridge-drift.log" >&2 || true

    - name: Summarize findings
      id: summarize
      shell: bash
      env:
        DRIFT_JSON: ${{ runner.temp }}/arcbridge-drift.json
        DRIFT_LOG: ${{ runner.temp }}/arcbridge-drift.log
        DRIFT_EXIT: ${{ steps.drift.outputs.exit-code }}
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        COMMENT_FILE: ${{ runner.temp }}/arcbridge-comment.md
      run: node "${{ github.action_path }}/summarize.mjs"

    - name: Post sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        COMMENT_FILE: ${{ runner.temp }}/arcbridge-comment.md
      with:
        script: |
          const fs = require("fs");
          const marker = "<!-- arcbridge-drift -->";
          try {
            const body = fs.readFileSync(process.env.COMMENT_FILE, "utf-8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // paginate: the marker comment may sit beyond the first page on long PRs
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (err) {
            // Commenting is best-effort — a missing pull-requests:write permission
            // (or an unwritten comment file) must not fail the drift check itself.
            core.warning(`Could not post drift comment: ${err.message}`);
          }

    - name: Enforce severity threshold
      shell: bash
      env:
        FAIL: ${{ steps.summarize.outputs.fail }}
        REASON: ${{ steps.summarize.outputs.fail-reason }}
      run: |
        if [ "$FAIL" = "true" ]; then
          # Escape workflow-command data (% first) so a reason containing
          # %0A/%0D sequences or newlines can't inject into the annotation
          esc="${REASON//'%'/%25}"
          esc="${esc//$'\r'/%0D}"
          esc="${esc//$'\n'/%0A}"
          echo "::error::$esc"
          exit 1
        fi
        echo "ArcBridge drift check passed."
