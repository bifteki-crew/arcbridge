blocks:
  - id: core
    name: Core
    level: 1
    code_paths:
      - packages/core/src/
    interfaces: []
    quality_scenarios: []
    adrs: []
    responsibility: "Domain heart of ArcBridge: zod schemas, SQLite database layer,
      arc42 + plan generators, the multi-language code indexer, drift detection,
      git helpers, YAML write-back/sync, roles, metrics, and config loading. Has
      no dependency on any other ArcBridge package or on the MCP SDK."
    service: core
  - id: adapters
    name: Platform Adapters
    level: 1
    code_paths:
      - packages/adapters/src/
    interfaces:
      - core
    quality_scenarios: []
    adrs: []
    responsibility: Platform-specific configuration generators (Claude Code, GitHub
      Copilot, Codex CLI, Gemini, OpenCode) plus shared
      instruction/skill/marker-merge helpers. Depends only on core.
    service: adapters
  - id: cli
    name: CLI
    level: 1
    code_paths:
      - packages/cli/src/
    interfaces:
      - core
      - adapters
    quality_scenarios: []
    adrs: []
    responsibility: "The `arcbridge` command-line binary: init, sync, status, drift,
      refresh, update-task, and generate-configs. Orchestrates core's
      index/drift/sync pipeline and adapters' config generation."
    service: cli
  - id: mcp-server
    name: MCP Server
    level: 1
    code_paths:
      - packages/mcp-server/src/
    interfaces:
      - core
    quality_scenarios: []
    adrs: []
    responsibility: "Thin Model Context Protocol shell: registers the ArcBridge MCP
      tools and maps each to core operations. Validates all params via zod and
      returns agent-facing results. Depends only on core."
    service: mcp-server
