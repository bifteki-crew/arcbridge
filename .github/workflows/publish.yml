name: Publish

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # setup-dotnet above guarantees the SDK, so the Roslyn-backed suites have
      # no legitimate reason to skip. Without this they turn themselves off when
      # the toolchain is unavailable and the run still exits 0 — which on the
      # publish path means shipping on the strength of a suite that never
      # exercised the C# indexer. Matches ci.yml; see dotnet-ready.ts.
      - run: pnpm test
        env:
          ARCBRIDGE_REQUIRE_DOTNET: "1"
      - run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
